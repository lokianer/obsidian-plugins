# Publishes site/ (the project page) to GitHub Pages. Needs Settings → Pages → Source:
# "GitHub Actions" once; afterwards every push to main that touches site/ or a plugin's
# screenshots deploys it. Each plugin keeps its screenshots in plugins/<id>/screenshots/; they are
# copied to site/assets/<id>/ here (and git-ignored there).
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'plugins/*/screenshots/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Screenshots from the plugins
        run: |
          for dir in plugins/*/screenshots; do
            id=$(basename "$(dirname "$dir")")
            mkdir -p "site/assets/$id"
            cp "$dir"/* "site/assets/$id/"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
